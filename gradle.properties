org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Reproducible build hygiene: pinned code style and deterministic resource
# packaging so two builds of the same source yield identical outputs.
kotlin.code.style=official
android.enableDetachedClassesAndResources=true
