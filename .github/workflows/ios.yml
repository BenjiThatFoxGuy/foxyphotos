name: Verify iOS build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-ios:
    name: Build shared core and iOS shell
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Kotlin/Native compiles the shared core to a static framework for both the
      # simulator and the device. This is the step that proves the portable
      # modules have no JVM-only dependencies.
      - name: Build shared core for both iOS variants
        run: |
          ./gradlew \
            :core:platform:linkDebugFrameworkIosSimulatorArm64 \
            :core:model:linkDebugFrameworkIosSimulatorArm64 \
            :core:backup:linkDebugFrameworkIosSimulatorArm64 \
            :provider:contract:linkDebugFrameworkIosSimulatorArm64 \
            :provider:foundation:linkDebugFrameworkIosSimulatorArm64 \
            :provider:google-core:linkDebugFrameworkIosSimulatorArm64 \
            :core:platform:linkDebugFrameworkIosArm64 \
            :core:model:linkDebugFrameworkIosArm64 \
            :core:backup:linkDebugFrameworkIosArm64 \
            :provider:contract:linkDebugFrameworkIosArm64 \
            :provider:foundation:linkDebugFrameworkIosArm64 \
            :provider:google-core:linkDebugFrameworkIosArm64 \
            --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      # generic/platform=iOS Simulator builds every standard architecture, so the
      # app wanted an x86_64 slice the Gradle-built Kotlin frameworks do not
      # contain. ARCHS pins it to the runner's own slice (macos-26-arm64).
      - name: Build iOS app for the simulator
        run: |
          xcodebuild \
            -project iosApp/FoxyPhotos.xcodeproj \
            -scheme FoxyPhotos \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      # The device target links the arm64 Kotlin frameworks and carries the Live
      # Activity extension. It is the same target the IPA is archived from, so it
      # is compiled here too.
      - name: Build iOS app for the device
        run: |
          xcodebuild \
            -project iosApp/FoxyPhotos.xcodeproj \
            -scheme FoxyPhotosDevice \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build/DerivedData \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Produces the sideloadable artifact. Unsigned on purpose: AltStore re-signs it
  # with the user's own Apple ID and provisioning profile, so no signing material
  # ever leaves the device.
  build-ipa:
    name: Build sideloadable IPA
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build shared core for iOS device
        run: |
          ./gradlew \
            :core:platform:linkDebugFrameworkIosArm64 \
            :core:model:linkDebugFrameworkIosArm64 \
            :core:backup:linkDebugFrameworkIosArm64 \
            :provider:contract:linkDebugFrameworkIosArm64 \
            :provider:foundation:linkDebugFrameworkIosArm64 \
            :provider:google-core:linkDebugFrameworkIosArm64 \
            --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Archive the device app without signing
        run: |
          xcodebuild archive \
            -project iosApp/FoxyPhotos.xcodeproj \
            -scheme FoxyPhotosDevice \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath iosApp/build/FoxyPhotos.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      # An .ipa is just Payload/<App>.app zipped. ExportArchive needs a provisioning
      # profile, so the archive is packaged by hand. The Live Activity extension is
      # embedded by the app target; AltStore re-signs the whole bundle.
      - name: Package the IPA
        run: |
          cd iosApp/build
          rm -rf Payload FoxyPhotos.ipa
          mkdir Payload
          cp -r FoxyPhotos.xcarchive/Products/Applications/FoxyPhotos.app Payload/
          find Payload/FoxyPhotos.app/Frameworks -type d -name "*.framework" \
            -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          zip -r FoxyPhotos.ipa Payload
          ls -lh FoxyPhotos.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FoxyPhotos.ipa
          path: iosApp/build/FoxyPhotos.ipa
          if-no-files-found: error
