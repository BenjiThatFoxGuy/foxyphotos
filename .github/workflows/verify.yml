name: Verify Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  # Needed to sign and record artifact attestations (Sigstore-backed SLSA
  # provenance). id-token mints the workload identity, attestations persists it.
  id-token: write
  attestations: write

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Android SDK cache
        uses: actions/cache@v4
        with:
          path: .android-sdk
          key: android-sdk-${{ runner.os }}-cmdline-16111833-api-36-build-tools-36.0.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        env:
          FOXYPHOTOS_KEYSTORE_BASE64: ${{ secrets.FOXYPHOTOS_KEYSTORE_BASE64 }}
          FOXYPHOTOS_KEY_ALIAS: ${{ secrets.FOXYPHOTOS_KEY_ALIAS }}
          FOXYPHOTOS_STORE_PASSWORD: ${{ secrets.FOXYPHOTOS_STORE_PASSWORD }}
          FOXYPHOTOS_KEY_PASSWORD: ${{ secrets.FOXYPHOTOS_KEY_PASSWORD }}
        run: |
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/foxyphotos-release.jks"
          printf '%s' "$FOXYPHOTOS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "FOXYPHOTOS_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "FOXYPHOTOS_KEY_ALIAS=$FOXYPHOTOS_KEY_ALIAS"
            echo "FOXYPHOTOS_STORE_PASSWORD=$FOXYPHOTOS_STORE_PASSWORD"
            echo "FOXYPHOTOS_KEY_PASSWORD=$FOXYPHOTOS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build and test
        env:
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          TASKS="check"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TASKS="$TASKS assembleDebug"
          fi
          if [[ "$BUILD_EVENT" != "pull_request" ]]; then
            TASKS="$TASKS assembleRelease"
          fi
          ./gradlew $TASKS --stacktrace

      - name: Test release automation
        run: python3 -m unittest discover -s .github/tests -v

      - name: Verify APK versions and package IDs
        run: python3 .github/verify-apks.py

      - name: Reproducible build report
        run: |
          chmod +x .github/repro-report.sh
          ./.github/repro-report.sh "$RUNNER_TEMP/repro-report.json"
          cat "$RUNNER_TEMP/repro-report.json"

      - name: Upload reproducible build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FoxyPhotos-repro-report-${{ github.sha }}
          path: ${{ runner.temp }}/repro-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: FoxyPhotos-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: FoxyPhotos-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*
          if-no-files-found: error
          retention-days: 14

      # Attest build provenance for the artifacts this run produced. GitHub signs
      # a statement binding each artifact digest to this workflow run, which is
      # what shows up as the "verified" provenance on the artifact.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            app/build/outputs/apk/**/*.apk

      - name: Attest release metadata
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: app/build/outputs/apk/release/release-manifest.json

  publish:
    name: Publish immutable tag release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v6
      - name: Download this run's signed APK
        uses: actions/download-artifact@v4
        with:
          name: FoxyPhotos-release-${{ github.sha }}
          path: app/build/outputs/apk/release
      - name: Verify provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify app/build/outputs/apk/release/app-release.apk
          --repo "$GITHUB_REPOSITORY"
          --source-digest "$GITHUB_SHA"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml"
      - name: Verify release metadata provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify app/build/outputs/apk/release/release-manifest.json
          --repo "$GITHUB_REPOSITORY"
          --source-digest "$GITHUB_SHA"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/verify.yml"
      - name: Upload to draft, verify both asset digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/publish-release.py
