name: Spike Rust packaging

on:
  push:
    branches: [spike/rust-uniffi-codec]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ndk:
    name: Android NDK library and Kotlin bindings
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: spikes/001-rust-uniffi-codec
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 16111833
          packages: |
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
          accept-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build arm64 Android library
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -o android-jniLibs build --release
      - name: Verify library and generate Kotlin bindings
        run: |
          file android-jniLibs/arm64-v8a/libfoxy_spike_codec.so
          cargo run --bin uniffi-bindgen -- generate \
            --library android-jniLibs/arm64-v8a/libfoxy_spike_codec.so \
            --language kotlin --out-dir out/android-kotlin
          echo '--- generated API ---'
          grep -nE '^fun |^public fun |^object |^class ' $(find out/android-kotlin -name '*.kt' | head -1) | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: spike-android-rust
          path: |
            spikes/001-rust-uniffi-codec/android-jniLibs
            spikes/001-rust-uniffi-codec/out/android-kotlin
          if-no-files-found: error

  ios-xcframework:
    name: iOS XCFramework and Swift bindings
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: spikes/001-rust-uniffi-codec
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build Rust static libraries
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
      - name: Generate Swift bindings
        run: |
          cargo build --release
          cargo run --bin uniffi-bindgen -- generate \
            --library target/release/libfoxy_spike_codec.dylib \
            --language swift --out-dir out/swift
      - name: Create XCFramework
        run: |
          mkdir -p xcframework
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libfoxy_spike_codec.a \
            -headers out/swift \
            -library target/aarch64-apple-ios-sim/release/libfoxy_spike_codec.a \
            -headers out/swift \
            -output xcframework/foxy_spike_codec.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: spike-ios-rust
          path: |
            spikes/001-rust-uniffi-codec/xcframework
            spikes/001-rust-uniffi-codec/out/swift
          if-no-files-found: error
