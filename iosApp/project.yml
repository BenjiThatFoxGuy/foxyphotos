name: FoxyPhotos
options:
  bundleIdPrefix: gay.benjifox
  # ActivityKit Live Activities need 16.1. The widget extension is embedded in
  # the app, so the whole app moves to that floor.
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The app target now carries a hand-written Info.plist (BGTaskScheduler and
    # array-valued keys cannot be expressed as INFOPLIST_KEY_ build settings).
    GENERATE_INFOPLIST_FILE: "NO"

# Both targets compile the same Swift sources and differ only in which Kotlin
# framework slices they link. One target is enough per build, so the device
# target is the one that ships; the simulator target is the fast CI check.
targets:
  FoxyPhotos:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: Shared/AlbumIndexAttributes.swift
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: FoxyPhotos
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "FoxyPhotos backs up the photos and videos you choose to a provider you own."
        NSPhotoLibraryAddUsageDescription: "FoxyPhotos restores your backups to the photo library you chose."
        # Lock Screen / Dynamic Island progress for a running backup or index.
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - gay.benjifox.foxyphotos.album-index
          - gay.benjifox.foxyphotos.backup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gay.benjifox.foxyphotos
        PRODUCT_NAME: FoxyPhotos
    dependencies:
      # Shared Kotlin core, built by Gradle into each module's build/bin directory.
      - framework: ../core/platform/build/bin/iosSimulatorArm64/debugFramework/FoxyPhotosPlatform.framework
        embedType: embed
      - framework: ../core/model/build/bin/iosSimulatorArm64/debugFramework/FoxyPhotosModel.framework
        embedType: embed
      - framework: ../core/backup/build/bin/iosSimulatorArm64/debugFramework/FoxyPhotosBackup.framework
        embedType: embed
      - framework: ../provider/contract/build/bin/iosSimulatorArm64/debugFramework/FoxyPhotosContract.framework
        embedType: embed
      - framework: ../provider/foundation/build/bin/iosSimulatorArm64/debugFramework/FoxyPhotosFoundation.framework
        embedType: embed
      - framework: ../provider/google-core/build/bin/iosSimulatorArm64/debugFramework/FoxyPhotosGoogleCore.framework
        embedType: embed
      - target: FoxyPhotosLiveActivity

  FoxyPhotosDevice:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      - path: Shared/AlbumIndexAttributes.swift
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: FoxyPhotos
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "FoxyPhotos backs up the photos and videos you choose to a provider you own."
        NSPhotoLibraryAddUsageDescription: "FoxyPhotos restores your backups to the photo library you chose."
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - gay.benjifox.foxyphotos.album-index
          - gay.benjifox.foxyphotos.backup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gay.benjifox.foxyphotos
        PRODUCT_NAME: FoxyPhotos
    dependencies:
      # arm64 device slices: this is what gets archived into the sideloadable IPA.
      - framework: ../core/platform/build/bin/iosArm64/debugFramework/FoxyPhotosPlatform.framework
        embedType: embed
      - framework: ../core/model/build/bin/iosArm64/debugFramework/FoxyPhotosModel.framework
        embedType: embed
      - framework: ../core/backup/build/bin/iosArm64/debugFramework/FoxyPhotosBackup.framework
        embedType: embed
      - framework: ../provider/contract/build/bin/iosArm64/debugFramework/FoxyPhotosContract.framework
        embedType: embed
      - framework: ../provider/foundation/build/bin/iosArm64/debugFramework/FoxyPhotosFoundation.framework
        embedType: embed
      - framework: ../provider/google-core/build/bin/iosArm64/debugFramework/FoxyPhotosGoogleCore.framework
        embedType: embed
      - target: FoxyPhotosLiveActivity

  # Displays the Live Activity. ActivityAttributes is shared source: the app
  # starts and updates the activity, this target only renders its content state.
  FoxyPhotosLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared/AlbumIndexAttributes.swift
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: FoxyPhotos
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gay.benjifox.foxyphotos.liveactivity
        PRODUCT_NAME: FoxyPhotosLiveActivity
        SKIP_INSTALL: "YES"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  FoxyPhotos:
    build:
      targets:
        FoxyPhotos: all
        FoxyPhotosLiveActivity: all
    archive:
      config: Debug
    run:
      config: Debug
  FoxyPhotosDevice:
    build:
      targets:
        FoxyPhotosDevice: all
        FoxyPhotosLiveActivity: all
    archive:
      config: Debug
    run:
      config: Debug
